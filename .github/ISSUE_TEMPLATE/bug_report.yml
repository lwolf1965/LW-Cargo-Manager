name: Bug report
description: Something does not work as the manual says
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown in the Pulsar plugin list and in the game log ("Loaded LwCargoManager ...").
      placeholder: 0.1.1.3
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version
      placeholder: e.g. 4.0.0.3169
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: names
    attributes:
      label: Block names involved
      description: The exact names with tags, for example "Connector [Unload All]" and "Cargo Container [Ore P1]".
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: Lines with [LwCargoManager] from the newest file in %AppData%\SpaceEngineers2\Temp\Logs.
      render: text
  - type: checkboxes
    id: mods
    attributes:
      label: Setup
      options:
        - label: The world uses mods
        - label: Other plugins are enabled
        - label: It also happens with a new empty world
